name: Bug report
description: Something doesn't work (black screen, no connection, crash, ...)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Short answers are fine. Please write in English or Turkish.
  - type: input
    id: version
    attributes:
      label: Pulsar version
      description: Settings -> General -> Version, or the release you downloaded. Both sides if they differ.
      placeholder: "0.22.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      description: The device that shows the problem. Pick all that apply.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Orange Pi / other single-board computer
        - Android
        - iOS
        - Relay server
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Your devices
      description: Both sides of the connection. System (Windows 11, macOS 15, Ubuntu 24.04 Wayland, Android 14, ...), graphics card, and which side shares its screen.
      placeholder: |
        Sharing: Windows 11, NVIDIA RTX 3060
        Connecting: Android 14, Samsung Galaxy S23
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Remote desktop
        - Game streaming
        - Not in a session (home screen, settings, install, update)
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Connection
      description: Shown in the session menu or the status bar.
      options:
        - Direct (P2P)
        - Relay
        - Same network (LAN)
        - Don't know
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Happened once
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Desktop: Settings -> General -> Open log folder, attach today's file.
        Linux: also paste the output of `Pulsar.AppImage --selftest`.
        Relay: the relay's output (remove passwords and 2FA secrets).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, what changed before it started.
